<script src="./assets/js/vue.js"></script>
<script src="./assets/js/sweetalert.min.js"></script>
<script>
var table = new Vue({
    el: '#table',
    data: { accesses: [] },
    methods: {
        getIpAddress: function(ip){
            swal("查询中......", ip , {
                icon: "info",
                buttons: false
            });
            fetch('./Data/api.php?type=getIpAddress&ip='+ip)
                .then(response => response.json())
                .then(json => {
                    var code = json.code;
                    var msg = json.msg;
                    if(code == 0){
                        swal(msg, json.data , {
                            icon: "success",
                            buttons: false
                        });
                    } else {
                        swal(msg, ip , {
                            icon: "error",
                            buttons: false
                        });
                    }
                });
        }
    },
    created (){
        fetch('./Data/api.php?type=getAccessInfo')
            .then(response => response.json())
            .then(json => {
                this.accesses = json.data;
            })
    }
});

$('.page').click(function(){
    var num = $(this).text();
    $(this).siblings('button').removeClass('mdui-btn-active');
    $(this).addClass('mdui-btn-active');
    fetch('./Data/api.php?type=getAccessInfo&num='+num)
        .then(response => response.json())
        .then(json => {
            table.accesses = json.data;
        });
});
</script>
