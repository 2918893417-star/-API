<script src="./assets/js/vue.js"></script>
<script src="./assets/js/sweetalert.min.js"></script>
<script>
    let control_link = new Vue({
        el: '#control_link',
        data: {
            links: [],
        },
        methods: {
            deleteLink: function(id) {
                swal({
                        title: "确定删除该链接?",
                        text: "请注意数据删除后将不可恢复！",
                        icon: "warning",
                        buttons: true,
                        dangerMode: true,
                    })
                    .then((willDelete) => {
                        if (willDelete) {
                            $.ajax({
                                method: 'POST',
                                url: './Data/post.php',
                                data: {
                                    type: 'del_link',
                                    id: id
                                },
                                beforeSend: function() {
                                    swal("删除中......", " ", {
                                        icon: "info",
                                        buttons: false
                                    });
                                },
                                success: function(data) {
                                    var code = JSON.parse(data).code;
                                    var msg = JSON.parse(data).msg;
                                    if (code == 0) {
                                        swal(msg, "2秒后自动刷新页面......", {
                                            icon: "success",
                                            buttons: false
                                        });
                                        setTimeout(function() {
                                            location.reload();
                                        }, 2000);
                                    } else {
                                        swal(msg, " ", {
                                            icon: "error",
                                            buttons: false
                                        });
                                    }
                                }
                            });
                        }
                    });
            },
            getLocalTime: function(nS) {
                return new Date(parseInt(nS) * 1000).toLocaleString().replace(/:\d{1,2}$/, ' ');
            }
        },
        created() {
            fetch('./Data/api.php?type=getAllLink')
                .then(response => response.json())
                .then(json => {
                    this.links = json.data;
                });

            // 获取待审核申请数量
            fetch('./Data/api.php?type=getApplyCount')
                .then(r => r.json())
                .then(json => {
                    const cnt = (json && json.data && json.data.count) ? Number(json.data.count) : 0;
                    if (cnt > 0) {
                        const entry = document.getElementById('apply-entry');
                        const cntEl = document.getElementById('apply-count');
                        if (entry) entry.style.display = 'inline-flex';
                        if (cntEl) cntEl.textContent = cnt > 99 ? '99+' : String(cnt);
                    }
                });
        }
    });
</script>
