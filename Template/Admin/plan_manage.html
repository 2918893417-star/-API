<script src="./assets/js/jquery.min.js"></script>
<script src="./assets/js/mdui.min.js"></script>
<script src="./assets/js/vue.js"></script>
<script>
    let app = new Vue({
        el: '#admin',
        data: {
            plans: [],
            editingPlan: { id: 0, name: '', description: '', price: 0, duration: 30, level: 1, sort: 0, status: 1, features: '' }
        },
        created() { this.loadPlans(); },
        methods: {
            loadPlans() {
                fetch('./Data/user.php?type=getAllPlans')
                    .then(r => r.json())
                    .then(json => { if(json.code === 0) this.plans = json.data; });
            },
            openAddDialog() {
                this.editingPlan = { id: 0, name: '', description: '', price: 0, duration: 30, level: 1, sort: 0, status: 1, features: '' };
                new mdui.Dialog('#plan-dialog').open();
            },
            editPlan(plan) {
                this.editingPlan = {...plan};
                new mdui.Dialog('#plan-dialog').open();
            },
            savePlan() {
                const body = new URLSearchParams();
                for(const key in this.editingPlan){
                    body.append(key, this.editingPlan[key]);
                }
                fetch('./Data/user.php?type=savePlan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body.toString()
                }).then(r => r.json()).then(json => {
                    if(json.code === 0){
                        mdui.snackbar('保存成功');
                        mdui.Dialog.getInstance('#plan-dialog').close();
                        this.loadPlans();
                    } else {
                        mdui.snackbar(json.msg);
                    }
                });
            },
            deletePlan(plan) {
                if(confirm('确定要删除套餐 ' + plan.name + ' 吗?')){
                    fetch('./Data/user.php?type=deletePlan', {
                        method: 'POST',
                        body: 'id=' + plan.id
                    }).then(r => r.json()).then(json => {
                        if(json.code === 0){
                            mdui.snackbar('删除成功');
                            this.loadPlans();
                        }
                    });
                }
            }
        }
    });

    // 顶栏添加按钮
    document.getElementById('addPlanBtn').addEventListener('click', function(){
        app.openAddDialog();
    });
</script>
