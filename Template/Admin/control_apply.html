<script src="./assets/js/vue.js"></script>
<script src="./assets/js/sweetalert.min.js"></script>
<script>
    let control_apply = new Vue({
        el: '#control_apply',
        data: {
            applies: []
        },
        methods: {
            onImgError(e) {
                e.target.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#e5e7eb"/><text x="50%" y="60%" text-anchor="middle" font-size="16" font-family="Arial" fill="#9ca3af">🔗</text></svg>'
                );
            },
            getLocalTime(nS) {
                if (!nS) return '—';
                return new Date(parseInt(nS) * 1000).toLocaleString().replace(/:\d{1,2}$/, ' ');
            },
            approve(id) {
                swal({
                    title: '确定通过该申请？',
                    text: '通过后将自动添加到正式友情链接',
                    icon: 'warning',
                    buttons: ['取消', '通过'],
                    dangerMode: false,
                }).then((willApprove) => {
                    if (willApprove) {
                        $.ajax({
                            method: 'POST',
                            url: './Data/post.php',
                            data: { type: 'approve_apply', id: id },
                            beforeSend: () => {
                                swal('正在审核...', ' ', { icon: 'info', buttons: false });
                            },
                            success: function (data) {
                                var json = JSON.parse(data);
                                if (json.code == 0) {
                                    swal(json.msg, '2 秒后刷新', { icon: 'success', buttons: false });
                                    setTimeout(() => location.reload(), 2000);
                                } else {
                                    swal(json.msg, ' ', { icon: 'error', buttons: false });
                                }
                            }
                        });
                    }
                });
            },
            del(id) {
                swal({
                    title: '确定驳回该申请？',
                    text: '驳回后申请记录将被删除，不可恢复',
                    icon: 'warning',
                    buttons: ['取消', '驳回'],
                    dangerMode: true,
                }).then((willDelete) => {
                    if (willDelete) {
                        $.ajax({
                            method: 'POST',
                            url: './Data/post.php',
                            data: { type: 'del_apply', id: id },
                            beforeSend: () => {
                                swal('处理中...', ' ', { icon: 'info', buttons: false });
                            },
                            success: function (data) {
                                var json = JSON.parse(data);
                                if (json.code == 0) {
                                    swal('已驳回', '2 秒后刷新', { icon: 'success', buttons: false });
                                    setTimeout(() => location.reload(), 2000);
                                } else {
                                    swal(json.msg, ' ', { icon: 'error', buttons: false });
                                }
                            }
                        });
                    }
                });
            }
        },
        created() {
            fetch('./Data/api.php?type=getAllApply')
                .then(r => r.json())
                .then(json => {
                    if (json.code === 0) {
                        this.applies = json.data || [];
                    }
                });
        }
    });
</script>
