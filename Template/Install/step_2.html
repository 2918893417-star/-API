<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>第二步 - 网站信息配置 | MXGAPI 管理系统</title>
    <link rel="stylesheet" href="./assets/css/install.css">
</head>
<body class="install-page">

<div class="install-aurora"></div>

<div class="install-container">

    <div class="install-header">
        <div class="install-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
        </div>
        <h1 class="install-title">MXGAPI 管理系统</h1>
        <p class="install-subtitle">配置系统管理员信息</p>
    </div>

    <div class="install-steps">
        <div class="install-step completed">
            <div class="install-step-circle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
            <span class="install-step-label">准备</span>
        </div>
        <div class="install-step-line completed"></div>
        <div class="install-step completed">
            <div class="install-step-circle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
            <span class="install-step-label">数据库</span>
        </div>
        <div class="install-step-line completed"></div>
        <div class="install-step active">
            <div class="install-step-circle">3</div>
            <span class="install-step-label">网站信息</span>
        </div>
        <div class="install-step-line"></div>
        <div class="install-step">
            <div class="install-step-circle">4</div>
            <span class="install-step-label">邮件配置</span>
        </div>
        <div class="install-step-line"></div>
        <div class="install-step">
            <div class="install-step-circle">5</div>
            <span class="install-step-label">完成</span>
        </div>
    </div>

    <div class="install-card">
        <div class="install-card-header">
            <div class="install-card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="9" y1="21" x2="9" y2="9"/>
                </svg>
            </div>
            <h2 class="install-card-title">网站信息配置</h2>
            <p class="install-card-desc">数据库连接成功！现在请填写网站基本信息和管理员账户，这些信息随时可以在后台修改。</p>
        </div>

        <div class="install-alert install-alert-success">
            <svg class="install-alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <div class="install-alert-content">
                <strong>数据库连接成功！</strong> 数据表已自动创建完成。
            </div>
        </div>

        <form action="./Core/install.php" method="post" class="install-form">
            <div class="install-form-group">
                <label class="install-form-label">站点标题 <span class="install-form-required">*</span></label>
                <input class="install-form-input" type="text" name="title" required placeholder="例如：沐朽阁API 管理系统">
                <div class="install-form-hint">显示在浏览器标签和首页的标题</div>
            </div>

            <div class="install-form-row">
                <div class="install-form-group">
                    <label class="install-form-label">管理员用户名 <span class="install-form-required">*</span></label>
                    <input class="install-form-input" type="text" name="username" required placeholder="建议使用 admin">
                    <div class="install-form-hint">登录后台管理使用的账户名</div>
                </div>
                <div class="install-form-group">
                    <label class="install-form-label">管理员密码 <span class="install-form-required">*</span></label>
                    <input class="install-form-input" type="password" name="password" required placeholder="至少 6 位字符">
                    <div class="install-form-hint">请妥善保管此密码</div>
                </div>
            </div>

            <div class="install-form-row">
                <div class="install-form-group">
                    <label class="install-form-label">管理员邮箱 <span class="install-form-required">*</span></label>
                    <input class="install-form-input" type="email" name="email" required placeholder="admin@example.com">
                    <div class="install-form-hint">用于密码找回和系统通知</div>
                </div>
                <div class="install-form-group">
                    <label class="install-form-label">站点域名 <span class="install-form-required">*</span></label>
                    <input class="install-form-input" type="text" name="domain" required placeholder="api.example.com">
                    <div class="install-form-hint">填写不带 http:// 的域名</div>
                </div>
            </div>

            <input type="hidden" name="step" value="2">

            <div class="install-actions">
                <a href="javascript:history.back()" class="install-btn install-btn-secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    返回
                </a>
                <button type="submit" class="install-btn install-btn-primary">
                    保存并继续
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <div class="install-footer">
        <p>© 2024 MXGAPI 管理系统 · 网站信息配置</p>
    </div>

</div>

</body>
</html>
