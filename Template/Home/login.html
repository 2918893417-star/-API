<body>
    <div class="auth-page">
        <a href="<?php echo $config['url'];?>" class="auth-back">
            <i class="fas fa-arrow-left"></i> 返回首页
        </a>
        <div class="auth-card" id="app">
            <div class="auth-header">
                <div class="auth-logo">⚡</div>
                <h1 class="auth-title">欢迎回来</h1>
                <p class="auth-subtitle">登录以使用全部 API 功能</p>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" @click="activeTab = 'login'">登录</div>
                <div class="auth-tab" @click="activeTab = 'register'">注册</div>
            </div>

            <!-- 登录表单 -->
            <div v-if="activeTab === 'login'">
                <div class="auth-form-group">
                    <label class="auth-label">用户名</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-user auth-input-icon"></i>
                        <input type="text" class="auth-input" v-model="loginForm.username" placeholder="请输入用户名" required>
                    </div>
                </div>
                <div class="auth-form-group">
                    <label class="auth-label">密码</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-lock auth-input-icon"></i>
                        <input type="password" class="auth-input" v-model="loginForm.password" placeholder="请输入密码" required>
                    </div>
                </div>
                <button class="auth-btn" @click="doLogin" :disabled="loading">
                    <span v-if="!loading">登录</span>
                    <span v-else>登录中...</span>
                </button>
            </div>

            <!-- 注册表单 -->
            <div v-else>
                <div class="auth-form-group">
                    <label class="auth-label">用户名</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-user auth-input-icon"></i>
                        <input type="text" class="auth-input" v-model="registerForm.username" placeholder="3-20位字符" required>
                    </div>
                </div>
                <div class="auth-form-group">
                    <label class="auth-label">邮箱</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-envelope auth-input-icon"></i>
                        <input type="email" class="auth-input" v-model="registerForm.email" placeholder="your@email.com" required>
                    </div>
                </div>
                <div class="auth-form-group">
                    <label class="auth-label">密码</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-lock auth-input-icon"></i>
                        <input type="password" class="auth-input" v-model="registerForm.password" placeholder="至少6位" required>
                    </div>
                </div>
                <div class="auth-form-group">
                    <label class="auth-label">确认密码</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-lock auth-input-icon"></i>
                        <input type="password" class="auth-input" v-model="registerForm.confirm_password" placeholder="再次输入密码" required>
                    </div>
                </div>
                <button class="auth-btn" @click="doRegister" :disabled="loading">
                    <span v-if="!loading">注册账号</span>
                    <span v-else>注册中...</span>
                </button>
            </div>

            <div class="auth-footer">
                <p>注册即表示同意我们的 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a></p>
            </div>
        </div>
    </div>

    <script src="./assets/js/jquery.min.js"></script>
    <script src="./assets/js/mdui.min.js"></script>
    <script src="./assets/js/vue.js"></script>
    <script>
        // Check if URL has tab parameter
        const urlParams = new URLSearchParams(window.location.search);
        const initialTab = urlParams.get('tab') === 'register' ? 'register' : 'login';
        
        let app = new Vue({
            el: '#app',
            data: {
                activeTab: initialTab,
                loading: false,
                loginForm: {
                    username: '',
                    password: ''
                },
                registerForm: {
                    username: '',
                    email: '',
                    password: '',
                    confirm_password: ''
                }
            },
            methods: {
                doLogin() {
                    if(!this.loginForm.username || !this.loginForm.password){
                        mdui.snackbar('请填写完整信息');
                        return;
                    }
                    this.loading = true;
                    fetch('./Data/user.php?type=login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'username=' + encodeURIComponent(this.loginForm.username) + '&password=' + encodeURIComponent(this.loginForm.password)
                    })
                    .then(r => r.json())
                    .then(json => {
                        this.loading = false;
                        if(json.code === 0){
                            mdui.snackbar('登录成功');
                            setTimeout(() => {
                                window.location.href = '?action=user_center';
                            }, 500);
                        } else {
                            mdui.snackbar(json.msg);
                        }
                    })
                    .catch(() => {
                        this.loading = false;
                        mdui.snackbar('网络错误');
                    });
                },
                doRegister() {
                    const f = this.registerForm;
                    if(!f.username || !f.email || !f.password){
                        mdui.snackbar('请填写完整信息');
                        return;
                    }
                    if(f.password.length < 6){
                        mdui.snackbar('密码至少6位');
                        return;
                    }
                    if(f.password !== f.confirm_password){
                        mdui.snackbar('两次密码不一致');
                        return;
                    }
                    this.loading = true;
                    fetch('./Data/user.php?type=register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'username=' + encodeURIComponent(f.username) + '&email=' + encodeURIComponent(f.email) + '&password=' + encodeURIComponent(f.password)
                    })
                    .then(r => r.json())
                    .then(json => {
                        this.loading = false;
                        if(json.code === 0){
                            mdui.snackbar('注册成功,请登录');
                            this.activeTab = 'login';
                            this.loginForm.username = f.username;
                            this.registerForm = { username: '', email: '', password: '', confirm_password: '' };
                        } else {
                            mdui.snackbar(json.msg);
                        }
                    })
                    .catch(() => {
                        this.loading = false;
                        mdui.snackbar('网络错误');
                    });
                }
            }
        });
    </script>
</body>
