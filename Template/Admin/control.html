<script src="./assets/js/vue.js"></script>
<script src="./assets/js/sweetalert.min.js"></script>
<script>
    let control = new Vue({
        el: '#control',
        data: {
            apis: [],
            searchContent: ''
        },
        methods: {
            /* 快速切换计费类型 */
            quickChangeChargeType: function(api) {
                var id = api.id;
                var charge_type = parseInt(api.charge_type);
                var typeNames = {0: '会员专用', 1: '按次计费', 2: '免费公开'};
                var typeName = typeNames[charge_type] || '未知';

                swal({
                        title: "确认切换计费类型?",
                        text: "接口「" + api.name + "」将切换为：" + typeName,
                        icon: "info",
                        buttons: ["取消", "确认切换"],
                    })
                    .then((willChange) => {
                        if (willChange) {
                            $.ajax({
                                method: 'POST',
                                url: './Data/post.php',
                                data: {
                                    type: 'quick_charge_type',
                                    id: id,
                                    charge_type: charge_type
                                },
                                success: function(data) {
                                    var json = JSON.parse(data);
                                    if (json.code == 0) {
                                        mdui.snackbar({
                                            message: json.msg,
                                            position: 'top',
                                            timeout: 2000
                                        });
                                        // 如果切换为非按次计费，前端同步清空价格显示
                                        if (charge_type !== 1) {
                                            api.price = 0;
                                        }
                                    } else {
                                        mdui.snackbar({
                                            message: json.msg,
                                            position: 'top',
                                            timeout: 3000
                                        });
                                        // 失败时重新加载数据恢复原值
                                        location.reload();
                                    }
                                },
                                error: function() {
                                    mdui.snackbar({
                                        message: '网络错误，切换失败',
                                        position: 'top',
                                        timeout: 3000
                                    });
                                    location.reload();
                                }
                            });
                        } else {
                            // 用户取消，重新加载数据恢复原值
                            location.reload();
                        }
                    });
            },
            /* 根据计费类型返回下拉框样式 */
            getChargeStyle: function(charge_type) {
                var ct = parseInt(charge_type);
                if (ct === 1) {
                    return 'background:linear-gradient(135deg,#06b6d4,#0891b2);color:white;border:none;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;outline:none;';
                } else if (ct === 2) {
                    return 'background:linear-gradient(135deg,#10b981,#059669);color:white;border:none;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;outline:none;';
                } else {
                    return 'background:linear-gradient(135deg,#fbbf24,#f59e0b);color:white;border:none;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;outline:none;';
                }
            },
            deleteApi: function(id) {
                swal({
                        title: "确定删除该接口?",
                        text: "请注意数据删除后将不可恢复！",
                        icon: "warning",
                        buttons: true,
                        dangerMode: true,
                    })
                    .then((willDelete) => {
                        if (willDelete) {
                            $.ajax({
                                method: 'POST',
                                url: './Data/post.php',
                                data: {
                                    type: 'del_api',
                                    id: id
                                },
                                beforeSend: function() {
                                    swal("删除中......", " ", {
                                        icon: "info",
                                        buttons: false
                                    });
                                },
                                success: function(data) {
                                    var code = JSON.parse(data).code;
                                    var msg = JSON.parse(data).msg;
                                    if (code == 0) {
                                        swal(msg, "2秒后自动刷新页面......", {
                                            icon: "success",
                                            buttons: false
                                        });
                                        setTimeout(function() {
                                            location.reload();
                                        }, 2000);
                                    } else {
                                        swal(msg, " ", {
                                            icon: "error",
                                            buttons: false
                                        });
                                    }
                                }
                            });
                        }
                    });
            }
        },
        created() {
            fetch('./Data/api.php?type=getAllApi')
                .then(response => response.json())
                .then(json => {
                    this.apis = json.data;
                })
        }
    });

    let search = new Vue({
        el: '#search',
        data: {
            apis: [],
            searchContent: '',
            searchResult: true,
            msg: false
        },
        methods: {
            focus: function() {
                this.code = true;
            }
        },
        watch: {
            searchContent: function(val) {
                if (val) {
                    fetch('./Data/api.php?type=searchApi&s=' + val)
                        .then(response => response.json())
                        .then(json => {
                            if (json.code == 0) {
                                this.searchResult = true;
                                this.apis = json.data;
                            } else {
                                this.searchResult = false;
                                this.msg = json.msg;
                            }
                        });
                } else {
                    this.searchResult = true;
                    this.apis = [];
                }
            }
        }
    });
</script>
</body>
</html>
