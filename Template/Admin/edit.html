<script src="./assets/js/vue.js"></script>
<script>
    // 为编辑接口页面添加特殊 class
    document.body.classList.add('page-add-api');

let edit_api = new Vue({
    el: '#edit_api',
    data: {
        info: {
            name: '',
            enname: '',
            desc: '',
            url: '',
            example_url: '',
            format: '',
            method: '',
            request_parameter: '',
            return_parameter: '',
            error_code: '',
            PHP_example: '',
            'return': '',
            status: '1',
            charge_type: '0',
            price: 0
        },
        websetting: []
    },
    methods: {
        update: function(){
            var id = getRequestParam('id');
            var charge_type = parseInt(this.info.charge_type) || 0;
            // 仅按次计费(charge_type=1)时才使用价格，免费公开(2)和会员专用(0)强制为0
            var price = charge_type === 1 ? (parseFloat(this.info.price) || 0) : 0;
            fetch('./Data/post.php',{
                method:'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body:'type=edit_api&id='+id+'&name='+encodeURIComponent(this.info.name)+'&enname='+encodeURIComponent(this.info.enname)+'&desc='+encodeURIComponent(this.info.desc)+'&url='+encodeURIComponent(this.info.url)+'&example_url='+encodeURIComponent(this.info.example_url)+'&format='+encodeURIComponent(this.info.format)+'&method='+encodeURIComponent(this.info.method)+'&request_parameter='+encodeURIComponent(this.info.request_parameter)+'&return_parameter='+encodeURIComponent(this.info.return_parameter)+'&error_code='+encodeURIComponent(this.info.error_code)+'&PHP_example='+encodeURIComponent(this.info.PHP_example)+'&return='+encodeURIComponent(this.info.return)+'&status='+encodeURIComponent(this.info.status)+'&charge_type='+charge_type+'&price='+price
            })
                .then(function(response) {
                    return response.text().then(function(text) {
                        try {
                            var json = JSON.parse(text);
                            return json;
                        } catch (e) {
                            throw new Error('服务器返回: ' + text.substring(0, 200));
                        }
                    });
                })
                .then(json => {
                    mdui.snackbar(json.msg)
                })
                .catch(function(error){
                    mdui.snackbar(error.message)
                })
        }
    },
    created (){
        var id = getRequestParam('id');
        fetch('./Data/api.php?type=getOneApi&id='+id)
            .then(response => response.json())
            .then(json => {
                if(json.code !== 0){
                    mdui.snackbar(json.msg || '获取数据失败');
                    return;
                }

                var data = json.data || {};
                
                // 辅助函数：将数据库中的JSON参数转为文本格式
                var paramToText = function(raw, fieldNames) {
                    try {
                        if(!raw) return '';
                        var rp = JSON.parse(raw);
                        var list = rp.data || rp;
                        if(!Array.isArray(list)) return '';
                        var lines = [];
                        list.forEach(function(item){
                            var parts = fieldNames.map(function(f){ return item[f] || ''; });
                            lines.push('[' + parts.join('--') + ']');
                        });
                        return lines.join('\n');
                    } catch(e) {
                        return '';
                    }
                };

                // 先构建完整的info对象，再一次性赋值给Vue以保证响应式
                var fullInfo = {
                    name: data.name || '',
                    enname: data.enname || '',
                    desc: data.desc || '',
                    url: data.url || '',
                    example_url: data.example_url || '',
                    format: data.format || '',
                    method: data.method || '',
                    request_parameter: paramToText(data.request_parameter, ['name','type','required','info']),
                    return_parameter: paramToText(data.return_parameter, ['name','type','msg']),
                    error_code: paramToText(data.error_code, ['code','msg']),
                    PHP_example: data.PHP_example || '',
                    'return': data['return'] || '',
                    status: data.status !== undefined ? String(data.status) : '1',
                    charge_type: data.charge_type !== undefined ? String(data.charge_type) : '0',
                    price: parseFloat(data.price) || 0
                };

                // 一次性赋值，Vue 2 会将所有属性设为响应式
                this.info = fullInfo;
            });
        fetch('./Data/api.php?type=getWebSetting')
            .then(response => response.json())
            .then(json => {
                this.websetting = json.data;
            });
    }
});
</script>
